<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Blippar WebAR Demo</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; }
    #webar-container { width: 100%; height: 100%; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://webar-sdk.blippar.com/releases/2.0.3/webar-sdk-v2.0.3.min.js"></script>
</head>
<body>
  <div id="webar-container"></div>

  <script>
    window.addEventListener("load", async () => {
      const waitForBlippar = () => new Promise((resolve, reject) => {
        const check = () => {
          if (window.Blippar) return resolve();
          setTimeout(check, 100);
        };
        check();
      });
  
      try {
        await waitForBlippar();
  
        const blippar = await Blippar.init({
          key: "c45fe6f7-1c8e-4af9-9181-2caec1633e9c",
          container: document.getElementById("webar-container"),
        });

        // Crear un círculo 3D
        const geometry = new THREE.CircleGeometry(1, 32); // Radio 1, 32 segmentos
        const material = new THREE.MeshBasicMaterial({ color: 0xffff00 }); // Color amarillo
        const circle = new THREE.Mesh(geometry, material);
        circle.position.set(0, 0, -2); // Ubicación en el espacio
        blippar.scene.add(circle);

      } catch (e) {
        console.error("Error al iniciar WebAR:", e);
      }
    });
  </script>
</body>
</html>
